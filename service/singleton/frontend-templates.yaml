- path: "admin-dist"
  name: "WushangAdmin"
  # The dashboard frontend is vendored in this repository (admin-frontend/)
  # and built locally by script/build-frontends.sh, then embedded into the
  # binary. Leaving version empty keeps fetch-frontends.sh from overwriting
  # the embedded build with an upstream release.
  repository: "https://github.com/CyL-Cly/wushang-panel"
  author: "CyL-Cly"
  version: ""
  is_admin: true
  is_official: true
- path: "user-dist"
  name: "Official"
